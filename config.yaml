calendar:
  name: Market Watchlist
  description: Rolling 30-day earnings and US market-events calendar for the configured watchlist.
  timezone: America/New_York
  window_days: 30
  timed_event_minutes: 30
  reminder_days_before: 1
  output_path: public/earnings.ics
  status_path: public/status.json

earnings:
  provider: fmp
  require_confirmed_only: false
  enrichment:
    nasdaq:
      enabled: true

links:
  include_tradingview: true
  include_apple_stocks: true

financial_events:
  enabled: true
  economic_calendar:
    enabled: true
    provider: official
    countries:
      - US
  market_holidays:
    enabled: true
    provider: calculated
    exchanges:
      - NASDAQ
      - NYSE
  witching_days:
    enabled: true
  files:
    - events/manual_events.yaml
