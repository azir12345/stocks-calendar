calendar:
  name: Market Watchlist
  description: Rolling 30-day earnings and US market-events calendar for the configured watchlist.
  timezone: America/New_York
  window_days: 30
  timed_event_minutes: 30
  reminder_days_before: 1
  output_path: public/earnings.ics
  status_path: public/status.json
  dashboard_path: public/dashboard.html
  compact_titles: true
  event_history:
    enabled: true
    path: .cache/event_history.json
    max_runs: 60
  ics_filter:
    min_impact_score: 70
    include_official_earnings: true

earnings:
  provider: auto
  require_provider: false
  require_confirmed_only: false
  include_observation_events: true
  official_ir_cache:
    path: .cache/official_ir_earnings.json
    ttl_hours: 18
    max_urls_per_symbol: 4
    timeout_seconds: 6
    max_elapsed_seconds: 45
  enrichment:
    nasdaq:
      enabled: true

url_validation:
  enabled: true
  max_urls: 80
  timeout_seconds: 4
  max_elapsed_seconds: 20

links:
  include_tradingview: true
  include_apple_stocks: true

portfolio:
  enabled: true
  source: personalhub_postgres
  project_root: /Users/azir/PersonalHub
  fallback_path: /Users/azir/PersonalHub/exports/dexter/investment_context.json
  symbol_map_file: data/symbol_mappings.yaml
  include_holdings_in_watchlist: true
  infer_market_holidays: true
  minimum_quantity: 0
  instrument_types:
    - equity

financial_events:
  enabled: true
  economic_calendar:
    enabled: true
    provider: official
    schedule_file: data/official_macro_releases.yaml
    countries:
      - US
  market_holidays:
    enabled: true
    provider: calculated
    exchanges:
      - NASDAQ
      - NYSE
      - KRX
  witching_days:
    enabled: true
  files:
    - events/manual_events.yaml
