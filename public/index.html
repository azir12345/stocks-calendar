<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>US Earnings Calendar</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f6f8;
        color: #15171a;
      }
      main {
        width: min(680px, calc(100% - 32px));
      }
      h1 {
        font-size: 28px;
        line-height: 1.2;
        margin: 0 0 12px;
      }
      p {
        font-size: 16px;
        line-height: 1.6;
        margin: 0 0 20px;
      }
      a {
        color: #0b63ce;
        font-weight: 700;
      }
      code {
        background: rgba(0, 0, 0, 0.08);
        border-radius: 6px;
        padding: 2px 6px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #111318;
          color: #f1f3f5;
        }
        a {
          color: #78aaff;
        }
        code {
          background: rgba(255, 255, 255, 0.14);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>US Earnings Calendar</h1>
      <p>订阅地址：<a href="earnings.ics">earnings.ics</a></p>
      <p>iOS 日历添加订阅时使用当前页面地址下的 <code>earnings.ics</code> 文件。</p>
    </main>
  </body>
</html>
